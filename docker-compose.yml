services:

  # --- MongoDB ---
  mongo:
    image: mongo:7          # Use official MongoDB image, no Dockerfile needed
    container_name: uitshare_mongo
    ports:
      - "27017:27017"       # host port : container port
    volumes:
      - mongo_data:/data/db # Persist MongoDB data in a volume to prevent data loss on restart

  # --- Node.js Server ---
  server:
    build: ./server         # Build from Dockerfile in the server/ directory
    container_name: uitshare_server
    ports:
      - "8080:8080"
    env_file:
      - ./server/.env       # Load environment variables from the .env file in server directory
    volumes:
      - ./server/uploads:/app/uploads   # Map uploads directory to the host machine
    depends_on:
      - mongo               # Wait for mongo to start before starting the server

  # --- React Client ---
  client:
    build: 
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_MARKETPLACE_CONTRACT_ADDRESS=${VITE_MARKETPLACE_CONTRACT_ADDRESS}
        - VITE_NFT_CONTRACT_ADDRESS=${VITE_NFT_CONTRACT_ADDRESS}
    container_name: uitshare_client
    ports:
      - "80:80"
    depends_on:
      - server

# Declare shared volumes
volumes:
  mongo_data:
  uploads_data: